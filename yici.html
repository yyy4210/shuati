<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>变电一次刷题</title>
<style>
  :root{
    --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#eff6ff;
    --green:#16a34a; --green-bg:#f0fdf4;
    --red:#dc2626; --red-bg:#fef2f2;
    --bg:#eef2f7; --card:#ffffff;
    --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --border-strong:#cbd5e1;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.07);
    --shadow-lg:0 8px 24px rgba(37,99,235,.35);
    --nav-bg:rgba(255,255,255,.95);
    --disclaimer-bg:#fef3c7; --disclaimer-c:#92400e; --disclaimer-bd:#fde68a;
    --explain-bg:#fffbeb; --explain-bd:#fde68a; --explain-c:#78350f;
    --opt-letter-bg:#f1f5f9; --opt-letter-c:#475569;
    --selected-bg:#eff6ff;
    --grad-logo:linear-gradient(135deg,#2563eb,#4f46e5);
    --grad-practice:linear-gradient(135deg,#10b981,#059669);
    --grad-exam:linear-gradient(135deg,#f59e0b,#ea580c);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    max-width:520px; margin:0 auto;
    height:100dvh; display:flex; flex-direction:column;
    position:relative;
  }
  .disclaimer{
    font-size:11px; color:var(--disclaimer-c); background:var(--disclaimer-bg);
    text-align:center; padding:5px 10px; flex-shrink:0;
    border-bottom:1px solid var(--disclaimer-bd);
  }
  .view{display:none; flex:1; flex-direction:column; overflow:hidden;}
  .view.active{display:flex;}

  /* ---------- 通用 ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:12px; padding:14px 16px;
    font-size:16px; font-weight:600; cursor:pointer;
    transition:transform .05s, filter .15s, background .15s;
    color:#fff; background:var(--primary);
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:transparent; color:var(--primary); box-shadow:inset 0 0 0 1.5px var(--primary);}
  .btn.gray{background:#e2e8f0; color:#475569;}
  .btn.big{font-size:18px; padding:16px 20px; border-radius:14px;}
  .btn[disabled]{opacity:.5; pointer-events:none;}
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px;
  }

  /* ---------- 首页 ---------- */
  #home{padding:0 16px; overflow-y:auto; align-items:stretch;}
  .home-hero{text-align:center; margin:auto 0 32px;}
  .home-menu{margin-bottom:auto;}
  .home-hero .logo{
    width:72px;height:72px;border-radius:20px;background:var(--grad-logo);
    color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px; box-shadow:var(--shadow-lg);
  }
  .home-hero h1{font-size:24px;margin:0 0 6px;}
  .home-hero p{color:var(--muted);margin:0;font-size:14px;}
  .home-stats{display:flex;justify-content:center;gap:14px;margin:18px 0 28px;flex-wrap:wrap;}
  .stat{background:var(--card);border-radius:12px;padding:10px 16px;text-align:center;box-shadow:var(--shadow);}
  .stat b{display:block;font-size:20px;color:var(--primary);}
  .stat span{font-size:12px;color:var(--muted);}
  .home-menu{display:flex;flex-direction:column;gap:14px;}
  .mode-btn{
    display:flex;align-items:center;gap:16px;text-align:left;
    background:var(--card);border:none;border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); cursor:pointer;
  }
  .mode-btn:active{transform:scale(.98);}
  .mode-btn .icon{width:48px;height:48px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
  .mode-btn.practice .icon{background:var(--grad-practice);}
  .mode-btn.exam .icon{background:var(--grad-exam);}
  .mode-btn b{font-size:17px;display:block;margin-bottom:3px;}
  .mode-btn span{font-size:13px;color:var(--muted);}

  /* ---------- 设置页 ---------- */
  #setup{padding:16px; overflow-y:auto;}
  .setup-group{margin-bottom:22px;}
  .setup-group>label{font-size:13px;color:var(--muted);display:block;margin-bottom:10px;font-weight:600;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--border); background:#fff; border-radius:999px;
    padding:9px 16px; font-size:14px; color:#475569; cursor:pointer; transition:all .15s;
  }
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600;}

  /* ---------- 答题头部 ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 14px 10px;
    background:var(--bg);
  }
  .topbar .back{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:2px 8px;border-radius:8px;}
  .topbar .back:active{background:#e2e8f0;}
  .topbar .title{flex:1;font-size:15px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .topbar .fav{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;color:#94a3b8;transition:color .15s;}
  .topbar .fav.on{color:#f59e0b;}
  .topbar .badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .badge.single{background:#dbeafe;color:#1d4ed8;}
  .badge.multi{background:#fef3c7;color:#b45309;}
  .badge.judge{background:#dcfce7;color:#15803d;}
  .badge.short{background:#ede9fe;color:#6d28d9;}
  .exam-time{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .exam-time.warn{color:var(--red);}
  .progress-track{height:4px;background:#e2e8f0;border-radius:2px;margin:0 14px 10px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .2s;}

  /* ---------- 题目区 ---------- */
  #quiz-area{flex:1;overflow-y:auto;padding:0 14px 96px;}
  .q-count{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .q-stem{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;font-size:17px;line-height:1.75;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;
  }
  .q-stem .q-num{color:var(--primary);font-weight:800;margin-right:4px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;
    padding:14px 16px;font-size:16px;line-height:1.6;cursor:pointer;transition:all .12s;text-align:left;width:100%;
  }
  .opt:active{background:#f8fafc;}
  .opt .letter{
    width:28px;height:28px;border-radius:8px;background:var(--opt-letter-bg);color:var(--opt-letter-c);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;margin-top:1px;
  }
  .opt .txt{flex:1;}
  /* 练习模式作答后状态 */
  .opt.correct{background:var(--green-bg);border-color:var(--green);}
  .opt.correct .letter{background:var(--green);color:#fff;}
  .opt.wrong{background:var(--red-bg);border-color:var(--red);}
  .opt.wrong .letter{background:var(--red);color:#fff;}
  .opt.dim{opacity:.45;}
  /* 考试模式选中态 */
  .opt.selected{border-color:var(--primary);background:var(--selected-bg);}
  .opt.selected .letter{background:var(--primary);color:#fff;}

  /* ---------- 反馈/解析 ---------- */
  .feedback{margin-top:16px;}
  .result-banner{
    border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .result-banner.ok{background:var(--green-bg);color:var(--green);}
  .result-banner.no{background:var(--red-bg);color:var(--red);}
  .explain{
    margin-top:12px;background:var(--explain-bg);border:1px solid var(--explain-bd);border-radius:12px;
    padding:14px 16px;font-size:14px;line-height:1.7;color:var(--explain-c);white-space:pre-wrap;
  }
  .explain b{display:block;margin-bottom:4px;}

  /* ---------- 底部导航 ---------- */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:var(--nav-bg);backdrop-filter:blur(8px);
    border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;
  }
  .bottom-nav .btn{flex:1;}
  .bottom-nav .btn.small-flex{flex:1;}
  .bottom-nav .btn.mid{flex:1.4;}

  /* ---------- 答题卡 ---------- */
  .sheet{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet.open{display:flex;}
  .sheet-panel{
    background:#fff;width:100%;max-width:520px;max-height:75dvh;overflow-y:auto;overflow-x:hidden;
    border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet-title{font-weight:700;font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .sheet-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;}
  .sheet-cell{
    aspect-ratio:1;border-radius:9px;border:1.5px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#475569;cursor:pointer;
  }
  .sheet-cell.current{border-color:var(--primary);color:var(--primary);background:#eff6ff;}
  .sheet-cell.answered{background:var(--primary);border-color:var(--primary);color:#fff;}
  .sheet-cell.correct{background:var(--green);border-color:var(--green);color:#fff;}
  .sheet-cell.wrong{background:var(--red);border-color:var(--red);color:#fff;}
  .sheet-cell.missed{background:#e2e8f0;border-color:#e2e8f0;color:#64748b;}
  .sheet-group-title{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;gap:8px;}
  .sheet-group-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .sheet-group-title:first-child{margin-top:0;}

  /* ---------- 成绩页 ---------- */
  #result{padding:16px; overflow-y:auto; align-items:stretch;}
  .score-card{text-align:center;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 18px;margin-bottom:16px;}
  .score-num{font-size:52px;font-weight:800;color:var(--primary);line-height:1;}
  .score-num small{font-size:20px;color:var(--muted);font-weight:600;}
  .score-label{font-size:14px;color:var(--muted);margin-top:8px;}
  .score-sub{margin-top:12px;font-size:14px;color:var(--muted);display:flex;justify-content:center;gap:18px;}
  .score-sub b{color:var(--text);font-size:17px;}
  .score-sub .g{color:var(--green);} .score-sub .r{color:var(--red);} .score-sub .m{color:#94a3b8;}
  .result-grid{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}
  .result-grid h3{margin:0 0 12px;font-size:15px;}

  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;
    background:rgba(15,23,42,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .fade-in{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}


  /* ---------- 切题过渡 ---------- */
  @keyframes quizInL{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:none;}}
  @keyframes quizInR{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:none;}}
  .quiz-in-l{animation:quizInL .2s ease;}
  .quiz-in-r{animation:quizInR .2s ease;}

  /* ---------- 反馈强化 ---------- */
  @keyframes bannerPop{0%{opacity:0;transform:scale(.92);}60%{opacity:1;transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}
  .banner-pop{animation:bannerPop .22s ease;}
  .explain .explain-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;margin-bottom:4px;}
  .explain .explain-body{line-height:1.7;}
  .explain .explain-toggle::after{content:"▾";color:var(--explain-c);}
  .explain.open .explain-toggle::after{content:"▴";color:var(--explain-c);}

  /* ---------- 考试历史趋势 ---------- */
  .trend-card{margin:18px 0 4px;}
  .trend-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .trend-head b{font-size:14px;}
  .trend-head span{font-size:12px;color:var(--muted);}
  .trend-note{font-size:12px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<div class="disclaimer">解析由 DeepSeek 生成，不保证准确性</div>

<div id="home" class="view active">
  <div class="home-hero">
    <div class="logo">一</div>
    <h1>变电一次刷题</h1>
    <p>单选 · 多选 · 判断</p>
    <div class="home-stats" id="home-stats"></div>
    <div id="home-trend"></div>
  </div>
  <div class="home-menu">
    <button class="mode-btn practice" onclick="openSetup('practice')">
      <div class="icon">✏️</div>
      <div><b>练习模式</b><span>顺序/随机刷题 · 即时对错 · 答案解析</span></div>
    </button>
    <button class="mode-btn exam" onclick="startExam()">
      <div class="icon">📝</div>
      <div><b>考试模式</b><span>单选50+多选15+判断20 · 60分钟 · 满分100</span></div>
    </button>
  </div>
</div>

<div id="setup" class="view">
  <div class="topbar">
    <button class="back" onclick="goHome()">‹</button>
    <div class="title" id="setup-title">练习设置</div>
  </div>
  <div style="padding:16px;">
    <div id="resume-wrap" style="margin-bottom:4px;"></div>
    <div class="setup-group">
      <label>题型范围</label>
      <div class="chip-row" id="chips-type"></div>
    </div>
    <div class="setup-group">
      <label>出题顺序</label>
      <div class="chip-row" id="chips-order">
        <button class="chip on" data-o="seq">顺序</button>
        <button class="chip" data-o="rand">随机</button>
      </div>
    </div>
    <div class="setup-group">
      <label>答案解析</label>
      <div class="chip-row" id="chips-explain">
        <button class="chip on" data-e="1">显示解析</button>
        <button class="chip" data-e="0">不显示</button>
      </div>
    </div>
    <button class="btn big" style="margin-top:8px;width:100%;" onclick="startPractice()">开始练习</button>
  </div>
</div>

<div id="quiz" class="view">
  <div class="topbar">
    <button class="back" id="quiz-back" onclick="quizBack()">‹</button>
    <div class="title" id="quiz-title">练习模式</div>
    <button class="fav" id="fav-btn" onclick="toggleFav()">☆</button>
    <span class="badge" id="quiz-badge"></span>
    <span class="exam-time" id="exam-time" style="display:none;"></span>
    <button class="btn" id="quiz-submit" onclick="submitExam()" style="display:none;padding:9px 14px;font-size:14px;border-radius:999px;flex-shrink:0;">交卷</button>
  </div>
  <div class="progress-track"><div class="progress-fill" id="quiz-progress"></div></div>
  <div id="quiz-area"></div>
  <div class="bottom-nav" id="quiz-nav"></div>
</div>

<div id="result" class="view">
  <div class="score-card">
    <div class="score-num" id="score-num">0</div>
    <div class="score-label" id="score-label">考试得分</div>
    <div class="score-sub" id="score-sub"></div>
  </div>
  <div class="result-grid">
    <h3>答题情况</h3>
    <div class="sheet-grid" id="result-grid"></div>
  </div>
  <button class="btn gray" style="width:100%;margin-bottom:10px;" onclick="startExam()">再考一次</button>
  <button class="btn ghost" style="width:100%;" onclick="goHome()">返回首页</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-panel">
    <div class="sheet-title"><span>答题卡</span><button class="sheet-close" onclick="closeSheet()">×</button></div>
    <div class="sheet-grid" id="sheet-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 题库数据（由 变电一次题库.xls 构建，379题）
const QUESTION_BANK = [
 {
  "id": 1,
  "type": "single",
  "stem": "测量高压开关柜主回路对地、相间绝缘电阻需用(____)V摇表，且绝缘电阻应≥500MΩ。",
  "options": {
   "A": "500",
   "B": "1000",
   "C": "1500",
   "D": "2500"
  },
  "answer": "D",
  "explain": "答案 D。测量高压开关柜主回路对地、相间绝缘需用2500V摇表：高压设备绝缘良好时电阻极大，需施加接近额定相电压的直流试验电压才能真实反映绝缘状况，2500V档正合适；500V、1000V档电压太低，只用于低压回路、控制回路测绝缘，用来测高压主回路会误判绝缘合格。1500V档虽在市场产品上并不少见，但传统电力规程与考题不将其作为高压设备绝缘测试的标准档位，故不选。规程要求主回路绝缘电阻≥500MΩ为合格下限。记忆点：试验电压要随设备电压等级走，高压主回路需2500V才够，电压不足会把绝缘好坏看错。"
 },
 {
  "id": 2,
  "type": "single",
  "stem": "高压开关柜内手车开关拉出后，隔离带电部位的(____)应可靠封闭，禁止开启。",
  "options": {
   "A": "橡胶板",
   "B": "绝缘板",
   "C": "隔板",
   "D": "挡板"
  },
  "answer": "D",
  "explain": "答案 D。手车开关拉出后，隔离带电部位的专用隔离件叫挡板（活门挡板），它随手车位置联动自动关闭，把带电的母线侧、线路侧静触头隔开，必须可靠封闭、禁止开启，防止人员误触带电部位。A橡胶板、B绝缘板、C隔板都不是该装置的标准名称，反措原文用词就是挡板。记忆点：手车拉出→活门挡板落下封闭，把带电触头完全隔开。"
 },
 {
  "id": 3,
  "type": "single",
  "stem": "开关柜触头镀银层厚度检测试验中，新建变电工程每个厂家每种型号的开关柜触头抽取一相的(____)触头进行检测，接触面为必检部位。",
  "options": {
   "A": "全部",
   "B": "部分",
   "C": "一个",
   "D": "三个"
  },
  "answer": "A",
  "explain": "答案 A。镀银层厚度直接决定触头接触电阻和长期通流能力，DL/T1424规定新建变电工程每个厂家每种型号的开关柜，触头抽取一相的全部触头进行检测，接触面为必检部位，这样样本才能代表该型号整批的镀层质量。B部分、C一个、D三个抽取数量偏少，检出局部漏镀、镀层偏薄的几率低，样本代表性不足。记忆点：样本要能代表整批质量，故抽一相全部触头检测、接触面必检，镀层好坏直接决定接触电阻和通流。"
 },
 {
  "id": 4,
  "type": "single",
  "stem": "依据变电安规，SF6配电装置发生大量泄漏等紧急情况时，人员应迅速撤出现场，开启所有排风机进行排风。未佩戴(____)人员禁止入内。",
  "options": {

<script>"use strict";
/* ================= 工具 ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function $(id){return document.getElementById(id);}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600);
}
function buzz(p){ if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0); if($("quiz-area"))$("quiz-area").scrollTop=0;
}
const TYPE_NAME={single:"单选题",multi:"多选题",judge:"判断题",short:"简答题"};
const TYPE_BADGE={single:["single","单选"],multi:["multi","多选"],judge:["judge","判断"],short:["short","简答"]};


/* ================= 全局状态 ================= */
const S={
  view:"home",
  mode:null,            // "practice" | "exam"
  list:[],              // 当前题目列表（含乱序后的选项顺序）
  idx:0,
  dir:1,                // 切题方向：1 下一题 / -1 上一题（用于过渡动画）
  _lastIdx:null,        // 上次渲染的题号（用于判断是否真的切题，避免点选项时整页闪动画）
  selected:[],          // 当前题已选字母
  answered:false,       // 练习模式当前题是否已作答
  answers:{},           // 考试模式: 序号->所选字母数组
  result:null,
  practice:{type:"all", order:"seq", explain:true},
  exam:null,
  favs:new Set(),        // 收藏的题目id
  practiceDone:{},       // 练习模式: 序号->{sel:[], ok:bool}（已作答记录）
};
/* 载入设置记忆 */
try{
  const p=JSON.parse(localStorage.getItem("yici_practice"));
  if(p){S.practice={type:p.type||"all",order:p.order||"seq",explain:p.explain!==false};}
}catch(e){}
/* 载入收藏 */
try{
  JSON.parse(localStorage.getItem("yici_favs")||"[]").forEach(x=>S.favs.add(x));
}catch(e){}
function saveFavs(){
  try{localStorage.setItem("yici_favs",JSON.stringify([...S.favs]));}catch(e){}
}
function toggleFav(){
  if(!S.list.length) return;
  const id=S.list[S.idx].q.id;
  if(S.favs.has(id))S.favs.delete(id); else S.favs.add(id);
  saveFavs();
  updateFavBtn();
  toast(S.favs.has(id)?"已收藏":"已取消收藏");
}
function updateFavBtn(){
  const btn=$("fav-btn"); if(!btn) return;
  const id=S.list[S.idx]?S.list[S.idx].q.id:null;
  if(id!==null && S.favs.has(id)){btn.textContent="★";btn.classList.add("on");}
  else{btn.textContent="☆";btn.classList.remove("on");}
}

/* ================= 恢复上次进度 ================= */
function saveResume(){
  if(S.mode!=="practice" || !S.list.length) return;
  try{
    localStorage.setItem("yici_resume", JSON.stringify({
      type:S.practice.type, order:S.practice.order,
      ids:S.list.map(i=>i.q.id), idx:S.idx, practiceDone:S.practiceDone, savedAt:Date.now(),
    }));
  }catch(e){}
}
function loadResume(){
  try{const r=JSON.parse(localStorage.getItem("yici_resume")||"null"); return r&&r.ids?r:null;}
  catch(e){return null;}
}
function clearResume(){ try{localStorage.removeItem("yici_resume");}catch(e){} }
function renderResumeWrap(){
  const w=$("resume-wrap"); if(!w) return;
  const rp=loadResume();
  w.innerHTML = (rp && rp.type===S.practice.type && rp.order===S.practice.order)
    ? `<div class="setup-group">
        <button class="btn ghost" style="width:100%;" onclick="resumePractice()">继续上次练习（第 ${Math.min(rp.idx+1,rp.ids.length)} / ${rp.ids.length} 题）</button>
      </div>`
    : "";
}
function resumePractice(){
  const rp=loadResume();
  if(!rp || rp.type!==S.practice.type || rp.order!==S.practice.order){toast("没有可恢复的进度");return;}
  const byId={}; allQuestions().forEach(q=>byId[q.id]=q);
  const qs=rp.ids.map(id=>byId[id]).filter(Boolean);
  if(!qs.length){toast("题目数据有变化，无法恢复");clearResume();return;}
  S.mode="practice"; S.list=buildList(qs); S.idx=Math.min(rp.idx, qs.length-1); S._lastIdx=null;
  S.selected=[]; S.answered=false; S.practiceDone=rp.practiceDone||{};
  $("quiz-back").onclick=()=>openSetup("practice");
  showView("quiz"); renderQuiz();
}

/* ================= 题库读取 ================= */
function allQuestions(){
  return (typeof QUESTION_BANK!=="undefined" && Array.isArray(QUESTION_BANK)) ? QUESTION_BANK : [];
}
function renderHomeStats(){
  const qs=allQuestions();
  const c={single:0,multi:0,judge:0,short:0};
  qs.forEach(q=>{c[q.type]=(c[q.type]||0)+1;});
  $("home-stats").innerHTML=
    `<div class="stat"><b>${qs.length}</b><span>总题数</span></div>
     <div class="stat"><b>${c.single||0}</b><span>单选</span></div>
     <div class="stat"><b>${c.multi||0}</b><span>多选</span></div>
     <div class="stat"><b>${c.judge||0}</b><span>判断</span></div>
     <div class="stat"><b>${S.favs.size}</b><span>收藏</span></div>`;
  renderTrend();
}
/* ================= 考试历史趋势 ================= */
function renderTrend(){

  if(!h.length){ box.innerHTML=""; return; }
  const last=h.slice(-10);
  const pct=last.map(x=>x.total?Math.round(x.correct/x.total*100):0);
  const avg=Math.round(pct.reduce((a,b)=>a+b,0)/pct.length);
  const max=Math.max(...pct);
  const W=300,H=64,P=6;
  const xs=pct.map((_,i)=>P+i*(W-2*P)/Math.max(pct.length-1,1));
  const ys=pct.map(v=>H-P-(v/100)*(H-2*P));
  const line=xs.map((x,i)=>`${i?"L":"M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.6" style="fill:${i===pct.length-1?"var(--primary)":"var(--muted)"}"/>`).join("");
  const lastPct=pct[pct.length-1];
  box.innerHTML=`<div class="card trend-card">
    <div class="trend-head"><b>📈 最近考试</b><span>平均 ${avg} 分 · 最高 ${max} 分</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:64px;">
      <line x1="${P}" y1="${ys[0]}" x2="${W-P}" y2="${ys[0]}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${line}" fill="none" style="stroke:var(--primary)" stroke-width="2" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div class="trend-note">最近一次 ${lastPct} 分 · 共 ${h.length} 次记录</div>
  </div>`;
}

function buildList(qs){
  // 每题生成选项顺序（order[i] = 该位置显示的原始选项字母）
  // 判断题固定 A=正确/B=错误，不随机；简答无选项；其余题型随机打乱
  return qs.map(q=>({
    q,
    order: q.type==="short" ? [] : (q.type==="judge" ? ["A","B"] : shuffle(Object.keys(q.options))),
    score: q.type==="multi" ? 2 : (q.type==="short" ? 5 : 1), // 单选/判断1分、多选2分、简答5分
  }));
}
// 将原始答案字母映射为当前显示的选项字母（选项内容已随机重排、标签重分配）
function dispAnswer(item){
  const q=item.q;
  const rev={}; item.order.forEach((k,i)=>rev[k]=String.fromCharCode(65+i));
  const mapped=[...q.answer].map(k=>rev[k]);
  if(q.type==="multi") mapped.sort(); // 多选答案字母按升序显示，避免乱序如 C、A、D
  return mapped.join(q.type==="multi"?"、":"");
}
// 解析文本里引用的原始选项字母(A-Z)映射为当前显示字母（选项顺序已打乱）。
// 只替换前后都不相邻字母/数字的孤立大写字母组合，避免误伤 kV/V/m 等单位。
function mapExplain(item, text){
  if(!text) return text;
  const q=item.q;
  const rev={}; item.order.forEach((k,i)=>rev[k]=String.fromCharCode(65+i));
  // ① 先纠正「选项字母+内容」引用（如 C40米、E80米、B6Ω、C1.5h）：原正则因字母后紧跟
  //    数字会跳过，这里用「选项内容作前缀」匹配替换——既改正字母，又不会误伤 SF6/F6、
  //    GB/T、kV 等非选项字母+数字的写法（选项内容匹配不上就不动）。
  text = text.replace(/(^|[^A-Za-z0-9])([A-Z])([0-9])/g, (m,p,ch,digit,offset,full)=>{
    const opt = q.options && q.options[ch];
    if(opt==null || opt==="") return m;              // 非选项字母（如 SF6 的 F）→ 保留
    const rest = full.slice(offset + m.length - 1);  // 从该字母后的第一个数字开始
    if(!rest.startsWith(String(opt))) return m;      // 选项内容必须是后续文本前缀才算引用
    return p + "[" + (rev[ch]||ch) + "]" + digit; // 只换字母，选项内容剩余部分原文保留
  });
  // ② 原有的映射：解析文本里引用的原始选项字母映射为当前显示字母（选项顺序已打乱）。
  //    只替换前后都不相邻字母/数字的孤立大写字母组合，避免误伤 kV/V/m 等单位；字母范围按
  //    本题实际选项数限定（A-E/A-F），这样 IEC/GOOSE/TWJ/GB/T 等缩写的超界字母不会被当作
  //    选项引用误映射。
  const lastCh = item.order.length ? String.fromCharCode(64+item.order.length) : "Z";
  return text.replace(new RegExp("(^答案\\s*|^|[^A-Za-z0-9\\[])([A-"+lastCh+"]+)(?![A-Za-z0-9])","g"), (m,p,seq)=>{
    const mapped=[...seq].map(ch=>rev[ch]||ch);
    if(p.startsWith("答案")){ mapped.sort(); return p+"["+mapped.join("")+"]"; } // 答案区整体加括号
    return p+mapped.map(x=>"["+x+"]").join(""); // 正文孤立引用逐个加括号
  });
}
/* ================= 渲染题目（共用） ================= */
function renderQuiz(){
  const item=S.list[S.idx]; const q=item.q;
  const isExam=S.mode==="exam";
  const pd = isExam?null:(S.practiceDone[S.idx]||null); // 练习已作答记录
  const answered = !!pd;
  const total=S.list.length;

  $("quiz-title").textContent = isExam?"考试模式":"练习模式";
  const [bclass,blabel]=TYPE_BADGE[q.type];
  const badge=$("quiz-badge"); badge.className="badge "+bclass; badge.textContent=blabel;
  $("quiz-progress").style.width=((S.idx+1)/total*100)+"%";
  const timeEl=$("exam-time"); if(timeEl) timeEl.style.display=(isExam&&!S.result)?"inline":"none";
  const subBtn=$("quiz-submit"); if(subBtn) subBtn.style.display=(isExam&&!S.result)?"flex":"none";

  const typeName=TYPE_NAME[q.type];
  const isNav = S._lastIdx===null || S._lastIdx!==S.idx; // 仅切题/首次渲染时播放过渡动画
  S._lastIdx=S.idx;
  let stem = `<div class="q-count"><span>${typeName}</span><span>第 ${S.idx+1} / ${total} 题</span></div>`;
  const qnum = isExam ? S.idx+1 : q.id; // 考试/回顾显示顺序号，练习显示题库号
  stem += `<div class="q-stem${isNav?" fade-in":""}"><span class="q-num">${qnum}.</span>${esc(q.stem)}</div>`;

  let opts="";
  if(q.type==="short"){
    if(isExam && S.result){
      // 交卷回顾：只读，展示参考答案 + 自评结果
      const sel=S.answers[S.idx]||[];
      const graded=sel.length>0, ok=sel[0]==="self-ok";
      const revExplain=q.explain
        ? `<div class="explain fade-in" style="margin-top:12px;"><b class="explain-toggle" onclick="toggleExplain(this)">📖 解析</b><div class="explain-body" style="display:block;">${esc(mapExplain(item, q.explain))}</div></div>`
        : `<div style="margin-top:12px;font-size:13px;color:var(--muted);">暂无解析</div>`;
      opts = `<div class="result-banner ${graded?(ok?"ok":"no"):""}" style="margin-top:12px;">${!graded?"⏭ 未作答（0 分）":(ok?"✓ 标记答对（+5 分）":"✗ 标记答错（0 分）")}</div>
              <div class="explain" style="margin-top:12px;"><b class="explain-toggle" onclick="toggleExplain(this)">📖 参考答案</b><div class="explain-body">${esc(mapExplain(item, q.answer||q.explain||"暂无"))}</div></div>
              ${revExplain}`;
    }else if(isExam){
      const sel=S.answers[S.idx]||[];
      const graded=sel.length>0, ok=sel[0]==="self-ok";
      opts = `<button class="btn ghost" style="width:100%;" onclick="revealShort(${S.idx})">查看参考答案</button>
              <div id="short-ans"></div>
              ${graded
                ? `<div class="result-banner ${ok?"ok":"no"} banner-pop" style="margin-top:12px;">${ok?"✓ 已标记答对（+5 分）":"✗ 已标记答错（0 分）"}</div>
                   <button class="btn gray" style="width:100%;margin-top:10px;" onclick="clearSelf(${S.idx})">取消标记</button>`
                : `<div style="display:flex;gap:10px;margin-top:12px;">
                     <button class="btn" style="flex:1;" onclick="selfGrade(${S.idx},true)">✓ 算答对</button>
                     <button class="btn gray" style="flex:1;" onclick="selfGrade(${S.idx},false)">✗ 算答错</button>
                   </div>`}`;
    }else{
      opts = `<button class="btn ghost" style="width:100%;" onclick="revealShort(${S.idx})">查看参考答案</button>
              <div id="short-ans"></div>`;
    }
  }else{
    const sel = isExam ? S.selected : (pd?pd.sel:S.selected);
    opts="<div class='opts'>"+item.order.map((letter,i)=>{
      const dl=String.fromCharCode(65+i); // 重新分配的显示标签（按选项数动态生成，无长度上限）
      let cls="opt";
      if(!answered && sel.includes(letter)) cls+=" selected";
      else if(answered){
        const isC=q.answer.includes(letter);
        const wasS=sel.includes(letter);
        if(isC) cls+=" correct";
        else if(wasS) cls+=" wrong";
        else cls+=" dim";
      }
      return `<button class="${cls}" onclick="pickOption('${letter}')" data-k="${letter}">
                <span class="letter">${dl}</span><span class="txt">${esc(q.options[letter])}</span>
              </button>`;
    }).join("")+"</div>";
  }

  let feedback="";
  if(isExam && S.result){
    // 交卷回顾：显示解析（与练习模式一致的渲染，默认展开）
    feedback=q.explain
      ? `<div class="explain fade-in" style="margin-top:12px;"><b class="explain-toggle" onclick="toggleExplain(this)">📖 解析</b><div class="explain-body" style="display:block;">${esc(mapExplain(item, q.explain))}</div></div>`
      : `<div style="margin-top:12px;font-size:13px;color:var(--muted);">暂无解析</div>`;
  }else if(isExam){
    feedback=`<div class="explain" style="display:none;"></div>`; // 考试进行中不显示反馈/解析
  }else if(answered){
    const ok=pd.ok;
    const ans = dispAnswer(item);
    const showExplain = S.practice.explain && q.explain;
    const noExplainYet = S.practice.explain && !q.explain;
    const expand = !ok;
    feedback=`<div class="feedback fade-in">
      <div class="result-banner ${ok?"ok":"no"} banner-pop">${ok?"✅ 回答正确":"❌ 回答错误，正确答案："+ans}</div>
      ${showExplain?`<div class="explain${expand?" open":""}"><b class="explain-toggle" onclick="toggleExplain(this)">📖 解析</b><div class="explain-body" style="display:${expand?"block":"none"};">${esc(mapExplain(item, q.explain))}</div></div>`
        :(noExplainYet?`<div style="margin-top:10px;font-size:13px;color:var(--muted);">暂无解析</div>`:"")}
      <button class="btn gray" style="width:100%;margin-top:10px;" onclick="redoQuestion()">↺ 重新作答</button>
    </div>`;
  }else if(q.type==="multi"){
    feedback=`<button class="btn mid" style="width:100%;" id="confirm-multi" ${S.selected.length?"":"disabled"} onclick="confirmMulti()">确认答案${S.selected.length?"（"+S.selected.length+"）":""}</button>`;
  }

  const animCls = isNav ? (S.dir>=0 ? "quiz-in-r" : "quiz-in-l") : "";
  $("quiz-area").innerHTML=`<div class="${animCls}">${stem+opts+feedback}</div>`;
  if(isNav) $("quiz-area").scrollTop=0;

  /* 底部导航 */
  let nav="";
  if(isExam){
    const answeredCount=Object.keys(S.answers).length;
    nav=`<button class="btn gray small-flex" ${S.idx===0?"disabled":""} onclick="nav(-1)">上一题</button>
         <button class="btn gray small-flex" onclick="openSheet()">答题卡 <span style="font-size:12px;opacity:.8">${answeredCount}/${total}</span></button>
         <button class="btn small-flex" ${S.idx===total-1?"disabled":""} onclick="nav(1)">下一题</button>`;
    $("quiz-nav").innerHTML=nav;
  }else{
    const doneCount=Object.keys(S.practiceDone).length;
    nav=`<button class="btn gray small-flex" ${S.idx===0?"disabled":""} onclick="nav(-1)">上一题</button>
         <button class="btn gray small-flex" onclick="openSheet()">答题卡 <span style="font-size:12px;opacity:.8">${doneCount}/${total}</span></button>
         <button class="btn small-flex" onclick="nav(1)">${S.idx===total-1?"完成":"下一题"}${answered?"":" · 先作答"}</button>`;
    $("quiz-nav").innerHTML=nav;
  }
  $("quiz-nav").style.display="flex";
  updateFavBtn();
  saveResume();
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function checkAnswer(q,choice){
  const ans=[...q.answer].sort().join("");
  const ch=[...choice].sort().join("");
  return ans===ch && ch.length>0;
}
/* 选项点击 */
function pickOption(letter){
  const item=S.list[S.idx], q=item.q;
  if(S.mode==="exam"){
    const sel=S.selected;
    const i=sel.indexOf(letter);
    if(i>=0)sel.splice(i,1); else sel.push(letter);
    if(q.type!=="multi" && sel.length>1) sel.splice(0,sel.length-1); // 单选/判断只能选1个
    S.answers[S.idx]=sel.slice();
    renderQuiz();
    return;
  }
  // 练习模式
  if(S.practiceDone[S.idx]) return; // 已作答，需点"重新作答"
  if(q.type==="multi"){
    const sel=S.selected;
    const i=sel.indexOf(letter);
    if(i>=0)sel.splice(i,1); else sel.push(letter);
    renderQuiz();
    return;
  }
  // 单选/判断：立即作答
  S.selected=[letter]; S.answered=true;
  S.practiceDone[S.idx]={sel:[letter], ok:checkAnswer(q,[letter])};
  buzz(S.practiceDone[S.idx].ok?15:[15,40,15]);
  renderQuiz();
}
function confirmMulti(){
  if(!S.selected.length) return;
  S.answered=true;
  const ok=checkAnswer(S.list[S.idx].q,S.selected);
  S.practiceDone[S.idx]={sel:S.selected.slice(), ok};
  buzz(ok?20:[20,40,20]);
  renderQuiz();
}
function redoQuestion(){
  delete S.practiceDone[S.idx];
  S.selected=[]; S.answered=false;
  renderQuiz();
}
function selfGrade(idx, ok){
  S.answers[idx]=ok?["self-ok"]:["self-no"];
  renderQuiz();
}
function clearSelf(idx){
  delete S.answers[idx];
  renderQuiz();
}
function toggleExplain(b){
  const box=b.parentElement;
  const body=box.querySelector(".explain-body");
  const open=body.style.display!=="none";
  body.style.display=open?"none":"block";
  box.classList.toggle("open",!open);
}
function revealShort(idx){
  const item=S.list[idx];
  const q=item.q;
  $("short-ans").innerHTML=`<div class="explain fade-in"><b>📖 参考答案</b>${esc(mapExplain(item, q.answer||q.explain||"暂无"))}</div>`;
}
function nav(d){
  S.dir=d;
  const n=S.list.length;
  let next=S.idx+d;
  if(S.mode==="practice"){
    // 若作答过：记录进度；未作答：跳到下一题（旧题保留）——这里直接切换
  }
  if(next<0||next>=n){
    if(S.mode==="practice" && d>0 && S.idx===n-1){
      toast("练习完成 🎉"); return;
    }
    return;
  }
  S.idx=next;
  if(S.mode==="exam"){
    S.selected=(S.answers[next]||[]).slice();
  }else{
    const pd=S.practiceDone[next];
    S.selected=pd?pd.sel.slice():[];
  }
  S.answered=false;
  renderQuiz();
}
function quizBack(){
  if(S.mode==="exam") goHome();
  else openSetup("practice");
}

/* ================= 考试模式 ================= */
let examTimer=null, examLeft=0;
function startExamTimer(){
  clearExamTimer();
  examLeft=60*60;
  updateExamTime();
  examTimer=setInterval(()=>{
    examLeft--;
    if(examLeft<=0){clearExamTimer(); toast("时间到，已自动交卷"); submitExam(true); return;}
    updateExamTime();
  },1000);
}
function updateExamTime(){
  const t=$("exam-time"); if(!t) return;
  const m=Math.floor(examLeft/60), s=examLeft%60;
  t.textContent=`⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  t.classList.toggle("warn", examLeft<=60);
}
function clearExamTimer(){ clearInterval(examTimer); examTimer=null; }
function startExam(){
  const byType=t=>allQuestions().filter(q=>q.type===t);
  const pick=(arr,n)=>shuffle(arr).slice(0,n);
  const single=pick(byType("single"),50);
  const multi=pick(byType("multi"),15);
  const judge=pick(byType("judge"),20);
  if(single.length<50||multi.length<15||judge.length<20){toast("题库数量不足，无法组卷");return;}
  const list=shuffle([...single,...multi,...judge]); // 混合题型，不含简答
  S.mode="exam"; S.list=buildList(list); S.idx=0; S.selected=[]; S.answers={}; S.result=null;
  $("quiz-back").onclick=()=>goHome();
  startExamTimer();
  showView("quiz"); renderQuiz();
}
function submitExam(fromTimer){
  const total=S.list.length;
  const answered=Object.keys(S.answers).length;
  if(!fromTimer && answered<total && !confirm(`还有 ${total-answered} 题未作答，确定交卷？`)) return;
  if(!fromTimer && !confirm("确定交卷？")) return;
  clearExamTimer();
  let okCount=0, wrong=0, missed=0, score=0, totalScore=0;
  const detail=[];
  for(let i=0;i<total;i++){
    const item=S.list[i], q=item.q;
    const pts=item.score; totalScore+=pts;
    const ans=S.answers[i]||[];
    if(!ans.length){detail.push("missed"); missed++; continue;}
    const ok=(q.type==="short") ? ans[0]==="self-ok" : checkAnswer(q,ans);
    if(ok){detail.push("correct"); okCount++; score+=pts;}
    else{detail.push("wrong"); wrong++;}
  }
  S.result={score, total:totalScore, correct:okCount, wrong, missed, detail};
  buzz([15,30,15]);
  saveExamHistory(S.result);
  const subBtn=$("quiz-submit"); if(subBtn) subBtn.style.display="none";
  showResult();
}
function showResult(){
  const r=S.result;
  $("score-num").innerHTML=`${r.score}<small> / ${r.total}</small>`;
  $("score-label").textContent = r.score===r.total?"🎉 满分！":(r.score>=r.total*0.8?"🏅 优秀":"📖 继续加油");
  $("score-sub").innerHTML=`<span>正确 <b class="g">${r.correct}</b></span>
                             <span>错误 <b class="r">${r.wrong}</b></span>
                             <span>未答 <b class="m">${r.missed}</b></span>`;
  const _grps=[["single","单选"],["multi","多选"],["judge","判断"],["short","简答"]];
  let _rh="";
  for(const [_t,_label] of _grps){
    const _ids=[];
    r.detail.forEach((_d,i)=>{ if(S.list[i] && S.list[i].q.type===_t) _ids.push(i); });
    if(!_ids.length) continue;
    _rh+=`<div class="sheet-group-title">${_label}（${_ids.length}）</div>`;
    _rh+=_ids.map(i=>{
      const d=r.detail[i];
      const cls=d==="correct"?"correct":(d==="wrong"?"wrong":"missed");
      return `<button class="sheet-cell ${cls}" onclick="reviewResult(${i})">${i+1}</button>`;
    }).join("");
  }
  $("result-grid").innerHTML=_rh;
  showView("result");
}
function reviewResult(idx){
  // 简单跳转：回到该题的考试回顾
  S.mode="exam"; S.idx=idx; S.answered=true;
  // 临时以"已交卷"方式展示：不可作答
  $("quiz-back").onclick=()=>showResult();
  showView("quiz");
  // 渲染后覆盖：展示正确答案与所选
  renderQuiz();
  const item=S.list[idx],q=item.q;
  const sel=(S.answers[idx]||[]);
  // 覆盖选项样式为判分样式
  const opts=document.querySelectorAll("#quiz-area .opt");
  opts.forEach(o=>{
    const letter=o.dataset.k; // 原始选项字母（显示标签已重新分配）
    o.classList.remove("selected","correct","wrong","dim");
    const isC=q.answer.includes(letter);
    const wasS=sel.includes(letter);
    if(isC)o.classList.add("correct");
    else if(wasS)o.classList.add("wrong");
    else o.classList.add("dim");
    o.onclick=null;
  });
  $("quiz-nav").innerHTML=`<button class="btn gray small-flex" ${S.idx===0?"disabled":""} onclick="navReview(-1)">上一题</button>
    <button class="btn small-flex" onclick="showResult()">查看成绩</button>
    <button class="btn gray small-flex" ${S.idx===r_total()-1?"disabled":""} onclick="navReview(1)">下一题</button>`;
  $("quiz-nav").style.display="flex";
  toast("已交卷，可查看答案与解析");
}
function r_total(){return S.list.length;}
function navReview(d){
  const i=S.idx+d;
  if(i<0||i>=r_total())return;
  S.idx=i;
  reviewResult(i);
}

/* ================= 答题卡 ================= */
function openSheet(){
  renderSheetGrid(); $("sheet").classList.add("open");
}
function closeSheet(){ $("sheet").classList.remove("open"); }
function renderSheetGrid(){
  const grps=[["single","单选"],["multi","多选"],["judge","判断"],["short","简答"]];
  let html="";
  for(const [t,label] of grps){
    const idxs=[];
    S.list.forEach((it,i)=>{ if(it.q.type===t) idxs.push(i); });
    if(!idxs.length) continue;
    html+=`<div class="sheet-group-title">${label}（${idxs.length}）</div>`;
    html+=idxs.map(i=>{
      const item=S.list[i], q=item.q;
      let cls="sheet-cell";
      if(S.mode==="exam" && S.result){
        cls+=" "+S.result.detail[i];
      }else if(S.mode==="exam"){
        if(S.answers[i]&&S.answers[i].length) cls+=" answered";
      }else{
        const pd=S.practiceDone[i];
        if(pd){ cls+= pd.ok?" correct":" wrong"; }
      }
      if(i===S.idx) cls+=" current";
      return `<button class="${cls}" onclick="jumpSheet(${i})">${i+1}</button>`;
    }).join("");
  }
  $("sheet-grid").innerHTML=html;
}
function jumpSheet(i){
  if(S.mode==="exam" && S.result){ closeSheet(); reviewResult(i); return; }
  S.idx=i;
  if(S.mode==="exam"){
    S.selected=(S.answers[i]||[]).slice();
  }else{
    const pd=S.practiceDone[i];
    S.selected=pd?pd.sel.slice():[];
  }
  S.answered=false;
  closeSheet();
  renderQuiz();
}

/* 初始化 */
function initApp(){
  renderHomeStats();
  /* 答题区左右滑动切题 */
  const area=$("quiz-area");
  if(area){
    let sx=0, sy=0;
    area.addEventListener("touchstart",e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
    area.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.2) nav(dx<0?1:-1);
    },{passive:true});
  }
}
document.addEventListener("DOMContentLoaded",initApp);
if(document.readyState!=="loading")initApp();</script>
